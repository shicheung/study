<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="每日英文" />
  <meta name="theme-color" content="#0f766e" />
  <title>每日英文打卡 · Daily English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-d: #0d5c56;
      --accent-soft: #ccfbf1;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --radius: 1rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 42%),
        radial-gradient(circle at bottom right, #fde68a 0%, transparent 38%),
        var(--bg);
      padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 26rem;
      margin: 0 auto;
    }

  header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0.2rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .streak-pill {
      flex-shrink: 0;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 0.45rem 0.65rem;
      min-width: 4.5rem;
    }

    .streak-pill .num {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--amber);
      line-height: 1.1;
    }

    .streak-pill .lbl {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 0.35rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.25rem;
      margin-bottom: 1rem;
    }

    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.5rem 0.35rem;
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem 1.15rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 6px 20px rgba(28, 25, 23, 0.04);
    }

    .date-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 0.4rem;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 0.65rem;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .item-row {
      padding: 0.65rem 0.75rem;
      background: var(--bg);
      border-radius: 0.65rem;
      border: 1px solid var(--line);
    }

    .item-text {
      font-size: 1.12rem;
      font-weight: 700;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--accent);
      margin: 0 0 0.2rem;
      line-height: 1.35;
    }

    .item-meaning {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }

    .example {
      margin: 0;
      padding: 0.75rem 0.9rem;
      background: var(--bg);
      border-radius: 0.65rem;
      border-left: 3px solid var(--accent);
      font-size: 0.95rem;
      line-height: 1.5;
      font-style: italic;
    }

    .task-box {
      background: var(--amber-soft);
      border: 1px solid #fcd34d;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      margin-top: 1rem;
    }

    .task-box p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .task-box strong {
      color: var(--amber);
    }

    textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      line-height: 1.55;
      padding: 0.75rem 0.85rem;
      border: 2px solid var(--line);
      border-radius: 0.75rem;
      background: #fffdf8;
      resize: vertical;
      min-height: 5.5rem;
      margin-top: 0.65rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 1rem;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.85rem;
      padding: 0.85rem 1rem;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.06s, box-shadow 0.06s;
    }

    .btn:active { transform: translateY(2px); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 0 var(--accent-d);
    }

    .btn-primary:active { box-shadow: 0 1px 0 var(--accent-d); }

    .btn-primary.done {
      background: var(--green);
      box-shadow: 0 4px 0 #15803d;
    }

    .btn-ghost {
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
    }

    .done-banner {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: var(--green-soft);
      border: 1px solid #86efac;
      border-radius: 0.75rem;
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.85rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #166534;
    }

    .done-banner.show { display: flex; }

    /* history */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .history-item {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 0.75rem 0.9rem;
      font: inherit;
      cursor: pointer;
      color: inherit;
    }

    .history-item:active { background: var(--accent-soft); }

    .history-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .history-item .d {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .history-item .w {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .dot-done {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .dot-pending {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--line);
      flex-shrink: 0;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1.25rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>每日英文打卡</h1>
        <p class="sub">Daily English · 學年每天 3 個寫作好詞句</p>
      </div>
      <div class="streak-pill" title="連續打卡天數">
        <span class="num" id="streakNum">0</span>
        <span class="lbl">🔥 連續天數</span>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="active" data-tab="today" role="tab">今日</button>
      <button type="button" data-tab="history" role="tab">往日</button>
    </nav>

    <section id="panelToday" class="panel active" role="tabpanel">
      <div id="doneBanner" class="done-banner" aria-live="polite">
        <span>✅</span>
        <span>今日已完成！明天見～</span>
      </div>
      <div id="todayCard"></div>
    </section>

    <section id="panelHistory" class="panel" role="tabpanel" hidden>
      <p class="sub" style="margin: 0 0 0.75rem">本學年（9月1日起）已過的日子，點選可溫習。</p>
      <div id="historyList" class="history-list"></div>
    </section>

    <section id="panelDay" class="panel" role="tabpanel" hidden>
      <a href="#" class="back-link" id="backFromDay">← 返回列表</a>
      <div id="dayCard"></div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="lessons.js"></script>
  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "daily-english-checkin-v1";
      const BANK = window.DAILY_SCHOOL_BANK || [];
      const BANK_DAYS = window.DAILY_SCHOOL_BANK_DAYS || BANK.length;

      const PLACEHOLDER_LESSON = {
        items: [
          { text: "ready", meaning: "準備好的" },
          { text: "new school year", meaning: "新學年" },
          { text: "fresh start", meaning: "重新出發" }
        ],
        example: "A new school year is a fresh start — get ready to learn!"
      };

      const store = {
        load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : { completed: {}, sentences: {} };
          } catch (e) {
            return { completed: {}, sentences: {} };
          }
        },
        save(data) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch (e) {
            toast("未能儲存進度");
          }
        }
      };

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function localDateKey(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      function parseDateKey(key) {
        const [y, m, day] = key.split("-").map(Number);
        return new Date(y, m - 1, day);
      }

      function formatDisplay(key) {
        const d = parseDateKey(key);
        const week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（星期" + week + "）";
      }

      /** HK school year: 1 Sep (startYear) → 31 Aug (startYear + 1). */
      function schoolYearStartYear(d) {
        return d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
      }

      function schoolYearLabel(startYear) {
        const end = (startYear + 1) % 100;
        return startYear + "–" + (end < 10 ? "0" : "") + end + " 學年";
      }

      function isLeapSchoolYear(startYear) {
        const febYear = startYear + 1;
        return (febYear % 4 === 0 && febYear % 100 !== 0) || febYear % 400 === 0;
      }

      function daysInSchoolYear(startYear) {
        return isLeapSchoolYear(startYear) ? 366 : 365;
      }

      function midnightLocal(d) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }

      /** 0 = 1 Sep; 364/365 = 31 Aug. Same calendar date → same index every year. */
      function schoolDayIndex(d) {
        const startYear = schoolYearStartYear(d);
        const anchor = new Date(startYear, 8, 1);
        return Math.floor((midnightLocal(d) - anchor) / 86400000);
      }

      function schoolYearStartDate(d) {
        const y = schoolYearStartYear(d);
        return new Date(y, 8, 1);
      }

      function getLesson(key) {
        const d = parseDateKey(key);
        const idx = schoolDayIndex(d);
        const max = daysInSchoolYear(schoolYearStartYear(d));
        if (idx < 0 || idx >= max || idx >= BANK.length) return PLACEHOLDER_LESSON;
        return BANK[idx] || PLACEHOLDER_LESSON;
      }

      function schoolDayLabel(key) {
        const d = parseDateKey(key);
        const idx = schoolDayIndex(d);
        if (idx < 0) return "";
        return schoolYearLabel(schoolYearStartYear(d)) + " · 第 " + (idx + 1) + " 天";
      }

      function itemsHtml(lesson) {
        return (
          '<div class="items-grid">' +
          lesson.items
            .map(function (item, i) {
              return (
                '<div class="item-row">' +
                '<p class="item-text">' +
                (i + 1) +
                ". " +
                escapeHtml(item.text) +
                "</p>" +
                '<p class="item-meaning">中文：' +
                escapeHtml(item.meaning) +
                "</p></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      function taskText(lesson) {
        const labels = lesson.items
          .map(function (item) {
            return "<strong>" + escapeHtml(item.text) + "</strong>";
          })
          .join("、");
        return "用今日其中一個或以上的詞語寫一句英文（可選：" + labels + "）。";
      }

      function historyPreview(lesson) {
        return lesson.items
          .map(function (item) {
            return item.text;
          })
          .join(" · ");
      }

      function computeStreak(completed) {
        let count = 0;
        const today = new Date();
        let d = midnightLocal(today);
        if (!completed[localDateKey(d)]) d.setDate(d.getDate() - 1);
        const yearStart = schoolYearStartDate(today).getTime();
        while (d.getTime() >= yearStart && completed[localDateKey(d)]) {
          count += 1;
          d.setDate(d.getDate() - 1);
        }
        return count;
      }

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(function () {
          el.classList.remove("show");
        }, 2200);
      }

      function renderCard(targetId, dateKey, options) {
        const opts = options || {};
        const isToday = opts.isToday;
        const lesson = getLesson(dateKey);
        const data = store.load();
        const done = !!data.completed[dateKey];
        const sentence = data.sentences[dateKey] || "";

        const html =
          '<article class="card">' +
          '<span class="date-badge">' + formatDisplay(dateKey) + "</span>" +
          '<p class="sub" style="margin:0 0 0.75rem;font-size:0.82rem">' + escapeHtml(schoolDayLabel(dateKey)) + "</p>" +
          '<p class="section-label">今日三項 · 3 words / phrases</p>' +
          itemsHtml(lesson) +
          '<p class="section-label">例句 Example</p>' +
          '<p class="example">' + escapeHtml(lesson.example) + "</p>" +
          '<div class="task-box"><p class="section-label" style="margin-bottom:0.4rem">小任務 Task</p><p>' +
          taskText(lesson) +
          "</p></div>" +
          (isToday
            ? '<label class="section-label" for="sentenceBox" style="display:block;margin-top:1rem">我的句子 My sentence</label>' +
              '<textarea id="sentenceBox" placeholder="Type your sentence here…">' +
              escapeHtml(sentence) +
              "</textarea>"
            : sentence
              ? '<p class="section-label" style="margin-top:1rem">當日句子</p><p class="example" style="font-style:normal">' +
                escapeHtml(sentence) +
                "</p>"
              : "") +
          "</article>";

        document.getElementById(targetId).innerHTML = html;

        if (isToday) {
          const banner = document.getElementById("doneBanner");
          const btn = document.getElementById("doneBtn");
          if (done) banner.classList.add("show");
          else banner.classList.remove("show");
          if (btn) {
            btn.textContent = done ? "✓ 已完成（再按可取消）" : "完成今日打卡";
            btn.classList.toggle("done", done);
          }
          const box = document.getElementById("sentenceBox");
          if (box) {
            box.addEventListener("input", function () {
              const d = store.load();
              d.sentences[dateKey] = box.value;
              store.save(d);
            });
          }
        }
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderToday() {
        const key = localDateKey(new Date());
        const data = store.load();
        const done = !!data.completed[key];

        document.getElementById("todayCard").innerHTML =
          '<div id="innerToday"></div>' +
          '<div class="btn-row">' +
          '<button type="button" class="btn btn-primary' +
          (done ? " done" : "") +
          '" id="doneBtn">' +
          (done ? "✓ 已完成（再按可取消）" : "完成今日打卡") +
          "</button>" +
          "</div>";

        renderCard("innerToday", key, { isToday: true });

        document.getElementById("doneBtn").addEventListener("click", function () {
          const d = store.load();
          const k = localDateKey(new Date());
          d.completed[k] = !d.completed[k];
          if (!d.completed[k]) delete d.completed[k];
          const box = document.getElementById("sentenceBox");
          if (box && box.value.trim()) d.sentences[k] = box.value.trim();
          store.save(d);
          updateStreak();
          renderToday();
          if (d.completed[k]) toast("太棒了！🔥");
        });
      }

      function renderHistory() {
        const list = document.getElementById("historyList");
        const data = store.load();
        const items = [];
        const today = midnightLocal(new Date());
        const yearStart = schoolYearStartDate(today);
        const d = new Date(today);
        while (d.getTime() >= yearStart.getTime()) {
          const key = localDateKey(d);
          items.push({ key: key, lesson: getLesson(key), done: !!data.completed[key] });
          d.setDate(d.getDate() - 1);
        }
        list.innerHTML = items
          .map(function (item) {
            return (
              '<button type="button" class="history-item" data-key="' +
              item.key +
              '">' +
              '<div class="top"><span class="d">' +
              formatDisplay(item.key) +
              "</span>" +
              '<span class="' +
              (item.done ? "dot-done" : "dot-pending") +
              '" title="' +
              (item.done ? "已完成" : "未完成") +
              '"></span></div>' +
              '<div class="w">' +
              historyPreview(item.lesson) +
              "</div></button>"
            );
          })
          .join("");

        list.querySelectorAll(".history-item").forEach(function (btn) {
          btn.addEventListener("click", function () {
            openDay(btn.getAttribute("data-key"));
          });
        });
      }

      function openDay(key) {
        showPanel("day");
        renderCard("dayCard", key, { isToday: false });
      }

      function showPanel(name) {
        const panels = { today: "panelToday", history: "panelHistory", day: "panelDay" };
        Object.keys(panels).forEach(function (p) {
          const el = document.getElementById(panels[p]);
          const active = p === name;
          el.classList.toggle("active", active);
          el.hidden = !active;
        });
        document.querySelectorAll(".tabs button").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === (name === "day" ? "history" : name));
        });
      }

      function updateStreak() {
        document.getElementById("streakNum").textContent = String(computeStreak(store.load().completed));
      }

      document.querySelectorAll(".tabs button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          showPanel(btn.getAttribute("data-tab"));
          if (btn.getAttribute("data-tab") === "history") renderHistory();
        });
      });

      document.getElementById("backFromDay").addEventListener("click", function (e) {
        e.preventDefault();
        showPanel("history");
        renderHistory();
      });

      renderToday();
      updateStreak();
    })();
  </script>
</body>
</html>
