<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="每日英文" />
  <meta name="theme-color" content="#0f766e" />
  <title>每日英文打卡 · Daily English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-d: #0d5c56;
      --accent-soft: #ccfbf1;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --radius: 1rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang HK", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 42%),
        radial-gradient(circle at bottom right, #fde68a 0%, transparent 38%),
        var(--bg);
      padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 26rem;
      margin: 0 auto;
    }

  header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0.2rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .streak-pill {
      flex-shrink: 0;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 0.45rem 0.65rem;
      min-width: 4.5rem;
    }

    .streak-pill .num {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--amber);
      line-height: 1.1;
    }

    .streak-pill .lbl {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 0.35rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.25rem;
      margin-bottom: 1rem;
    }

    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.5rem 0.35rem;
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
    }

    .tabs button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem 1.15rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 6px 20px rgba(28, 25, 23, 0.04);
    }

    .date-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 0.4rem;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 0.65rem;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .item-row {
      padding: 0.65rem 0.75rem;
      background: var(--bg);
      border-radius: 0.65rem;
      border: 1px solid var(--line);
    }

    .item-text {
      font-size: 1.12rem;
      font-weight: 700;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--accent);
      margin: 0 0 0.2rem;
      line-height: 1.35;
    }

    .item-meaning {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }

    .example {
      margin: 0;
      padding: 0.75rem 0.9rem;
      background: var(--bg);
      border-radius: 0.65rem;
      border-left: 3px solid var(--accent);
      font-size: 0.95rem;
      line-height: 1.5;
      font-style: italic;
    }

    .task-box {
      background: var(--amber-soft);
      border: 1px solid #fcd34d;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      margin-top: 1rem;
    }

    .task-box p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .task-box strong {
      color: var(--amber);
    }

    textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      line-height: 1.55;
      padding: 0.75rem 0.85rem;
      border: 2px solid var(--line);
      border-radius: 0.75rem;
      background: #fffdf8;
      resize: vertical;
      min-height: 5.5rem;
      margin-top: 0.65rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 1rem;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.85rem;
      padding: 0.85rem 1rem;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.06s, box-shadow 0.06s;
    }

    .btn:active { transform: translateY(2px); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 0 var(--accent-d);
    }

    .btn-primary:active { box-shadow: 0 1px 0 var(--accent-d); }

    .btn-primary.done {
      background: var(--green);
      box-shadow: 0 4px 0 #15803d;
    }

    .btn-ghost {
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line);
    }

    .done-banner {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: var(--green-soft);
      border: 1px solid #86efac;
      border-radius: 0.75rem;
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.85rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #166534;
    }

    .done-banner.show { display: flex; }

    /* history */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .history-item {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 0.75rem 0.9rem;
      font: inherit;
      cursor: pointer;
      color: inherit;
    }

    .history-item:active { background: var(--accent-soft); }

    .history-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .history-item .d {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .history-item .w {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .dot-done {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .dot-pending {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--line);
      flex-shrink: 0;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1.25rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>每日英文打卡</h1>
        <p class="sub">Daily English · 每天 3 個寫作好詞句</p>
      </div>
      <div class="streak-pill" title="連續打卡天數">
        <span class="num" id="streakNum">0</span>
        <span class="lbl">🔥 連續天數</span>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="active" data-tab="today" role="tab">今日</button>
      <button type="button" data-tab="history" role="tab">往日</button>
    </nav>

    <section id="panelToday" class="panel active" role="tabpanel">
      <div id="doneBanner" class="done-banner" aria-live="polite">
        <span>✅</span>
        <span>今日已完成！明天見～</span>
      </div>
      <div id="todayCard"></div>
    </section>

    <section id="panelHistory" class="panel" role="tabpanel" hidden>
      <p class="sub" style="margin: 0 0 0.75rem">點選日期可重新溫習該天的內容。</p>
      <div id="historyList" class="history-list"></div>
    </section>

    <section id="panelDay" class="panel" role="tabpanel" hidden>
      <a href="#" class="back-link" id="backFromDay">← 返回列表</a>
      <div id="dayCard"></div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "daily-english-checkin-v1";
      const ANCHOR = new Date(2024, 0, 1);

      const DAYS = [
        {
          items: [
            { text: "concentrate", meaning: "專心" },
            { text: "pay attention", meaning: "留心聽／看" },
            { text: "hard-working", meaning: "勤奮的" }
          ],
          example: "The hard-working pupils concentrate and pay attention during the lesson."
        },
        {
          items: [
            { text: "cooperate", meaning: "合作" },
            { text: "in a team", meaning: "在團隊中" },
            { text: "support each other", meaning: "互相支持" }
          ],
          example: "We cooperate in a team and support each other on the project."
        },
        {
          items: [
            { text: "organised", meaning: "有條理的" },
            { text: "on time", meaning: "準時" },
            { text: "hand in", meaning: "上交（功課）" }
          ],
          example: "She is organised, arrives on time, and hands in her homework early."
        },
        {
          items: [
            { text: "confident", meaning: "有信心的" },
            { text: "try my best", meaning: "盡力而為" },
            { text: "never give up", meaning: "永不放棄" }
          ],
          example: "I feel confident when I try my best and never give up."
        },
        {
          items: [
            { text: "nervous", meaning: "緊張的" },
            { text: "take a deep breath", meaning: "深呼吸" },
            { text: "calm down", meaning: "冷靜下來" }
          ],
          example: "Before the test, I felt nervous, but I took a deep breath and calmed down."
        },
        {
          items: [
            { text: "delighted", meaning: "非常開心的" },
            { text: "proud of myself", meaning: "為自己自豪" },
            { text: "well done", meaning: "做得好" }
          ],
          example: "I was delighted and proud of myself when the teacher said, \"Well done!\""
        },
        {
          items: [
            { text: "disappointed", meaning: "失望的" },
            { text: "however", meaning: "然而" },
            { text: "keep going", meaning: "繼續努力" }
          ],
          example: "I was disappointed with my score; however, I will keep going."
        },
        {
          items: [
            { text: "respect", meaning: "尊重" },
            { text: "politely", meaning: "有禮貌地" },
            { text: "raise my hand", meaning: "舉手" }
          ],
          example: "We respect our teachers and speak politely when we raise our hands."
        },
        {
          items: [
            { text: "curious", meaning: "好奇的" },
            { text: "find out", meaning: "找出／查明" },
            { text: "ask questions", meaning: "發問" }
          ],
          example: "I am curious, so I like to ask questions and find out more."
        },
        {
          items: [
            { text: "explain", meaning: "解釋" },
            { text: "clearly", meaning: "清楚地" },
            { text: "in detail", meaning: "詳細地" }
          ],
          example: "The monitor can explain the rules clearly and in detail."
        },
        {
          items: [
            { text: "helpful", meaning: "樂於助人的" },
            { text: "take care of", meaning: "照顧" },
            { text: "younger brother", meaning: "弟弟" }
          ],
          example: "At home, I am helpful and take care of my younger brother."
        },
        {
          items: [
            { text: "responsible", meaning: "有責任感的" },
            { text: "chores", meaning: "家務" },
            { text: "without being asked", meaning: "不用人提醒" }
          ],
          example: "I am responsible and do my chores without being asked."
        },
        {
          items: [
            { text: "grateful", meaning: "感激的" },
            { text: "because of", meaning: "因為／由於" },
            { text: "kindness", meaning: "善意" }
          ],
          example: "I feel grateful because of my parents' kindness."
        },
        {
          items: [
            { text: "quarrel", meaning: "爭吵" },
            { text: "apologise", meaning: "道歉" },
            { text: "make up", meaning: "和好" }
          ],
          example: "After a quarrel, we apologise and make up quickly."
        },
        {
          items: [
            { text: "memorable", meaning: "難忘的" },
            { text: "family dinner", meaning: "家庭晚餐" },
            { text: "chat together", meaning: "一起聊天" }
          ],
          example: "It was a memorable family dinner when we chatted together."
        },
        {
          items: [
            { text: "at the weekend", meaning: "在週末" },
            { text: "explore", meaning: "探索" },
            { text: "country park", meaning: "郊野公園" }
          ],
          example: "At the weekend, we explore the country park on foot."
        },
        {
          items: [
            { text: "breathtaking", meaning: "令人驚嘆的" },
            { text: "scenery", meaning: "景色" },
            { text: "take photos", meaning: "拍照" }
          ],
          example: "The scenery was breathtaking, so we took many photos."
        },
        {
          items: [
            { text: "exhausted", meaning: "筋疲力盡的" },
            { text: "after a long hike", meaning: "走完長途後" },
            { text: "refreshing", meaning: "提神的" }
          ],
          example: "After a long hike, I was exhausted but the drink was refreshing."
        },
        {
          items: [
            { text: "indoors", meaning: "在室內" },
            { text: "board game", meaning: "桌上遊戲" },
            { text: "laugh loudly", meaning: "大笑" }
          ],
          example: "It rained, so we stayed indoors and played a board game. We laughed loudly."
        },
        {
          items: [
            { text: "volunteer", meaning: "做義工" },
            { text: "elderly", meaning: "長者" },
            { text: "spread joy", meaning: "帶來歡樂" }
          ],
          example: "We volunteer to visit the elderly and spread joy."
        },
        {
          items: [
            { text: "generous", meaning: "慷慨的" },
            { text: "donate", meaning: "捐贈" },
            { text: "those in need", meaning: "有需要的人" }
          ],
          example: "Our school is generous and donates books to those in need."
        },
        {
          items: [
            { text: "environment", meaning: "環境" },
            { text: "reduce waste", meaning: "減少浪費" },
            { text: "recycle", meaning: "回收" }
          ],
          example: "We protect the environment when we reduce waste and recycle."
        },
        {
          items: [
            { text: "although", meaning: "雖然" },
            { text: "challenging", meaning: "有挑戰性的" },
            { text: "succeed", meaning: "成功" }
          ],
          example: "Although the task was challenging, we succeeded in the end."
        },
        {
          items: [
            { text: "suddenly", meaning: "突然" },
            { text: "realise", meaning: "意識到" },
            { text: "by accident", meaning: "意外地" }
          ],
          example: "Suddenly, I realised I had left my book at home by accident."
        },
        {
          items: [
            { text: "meanwhile", meaning: "與此同時" },
            { text: "prepare", meaning: "準備" },
            { text: "presentation", meaning: "匯報／展示" }
          ],
          example: "Meanwhile, my classmate prepared a wonderful presentation."
        },
        {
          items: [
            { text: "thrilled", meaning: "非常興奮的" },
            { text: "invitation", meaning: "邀請" },
            { text: "accept", meaning: "接受" }
          ],
          example: "I was thrilled to get an invitation and gladly accepted it."
        },
        {
          items: [
            { text: "embarrassed", meaning: "尷尬的" },
            { text: "cheer me up", meaning: "令我振奮" },
            { text: "encouraging words", meaning: "鼓勵的話" }
          ],
          example: "I felt embarrassed, but my friend's encouraging words cheered me up."
        },
        {
          items: [
            { text: "peaceful", meaning: "寧靜的" },
            { text: "relax", meaning: "放鬆" },
            { text: "after school", meaning: "放學後" }
          ],
          example: "After school, the library is peaceful and I can relax with a book."
        },
        {
          items: [
            { text: "delicious", meaning: "美味的" },
            { text: "homemade", meaning: "自家製的" },
            { text: "special treat", meaning: "特別的美食" }
          ],
          example: "Grandma made a delicious, homemade soup as a special treat."
        },
        {
          items: [
            { text: "improve", meaning: "改善／進步" },
            { text: "step by step", meaning: "一步步" },
            { text: "practice regularly", meaning: "定時練習" }
          ],
          example: "I improve step by step when I practice regularly."
        },
        {
          items: [
            { text: "determined", meaning: "堅定的" },
            { text: "achieve", meaning: "達成" },
            { text: "my goal", meaning: "我的目標" }
          ],
          example: "I am determined to achieve my goal this term."
        }
      ];

      const store = {
        load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : { completed: {}, sentences: {} };
          } catch (e) {
            return { completed: {}, sentences: {} };
          }
        },
        save(data) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch (e) {
            toast("未能儲存進度");
          }
        }
      };

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function localDateKey(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      function parseDateKey(key) {
        const [y, m, day] = key.split("-").map(Number);
        return new Date(y, m - 1, day);
      }

      function formatDisplay(key) {
        const d = parseDateKey(key);
        const week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（星期" + week + "）";
      }

      /** Same calendar day always maps to the same lesson; cycles every DAYS.length days. */
      function contentIndexForDate(d) {
        const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const diff = Math.floor((midnight - ANCHOR) / 86400000);
        return ((diff % DAYS.length) + DAYS.length) % DAYS.length;
      }

      function getLesson(key) {
        return DAYS[contentIndexForDate(parseDateKey(key))];
      }

      function itemsHtml(lesson) {
        return (
          '<div class="items-grid">' +
          lesson.items
            .map(function (item, i) {
              return (
                '<div class="item-row">' +
                '<p class="item-text">' +
                (i + 1) +
                ". " +
                escapeHtml(item.text) +
                "</p>" +
                '<p class="item-meaning">中文：' +
                escapeHtml(item.meaning) +
                "</p></div>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      function taskText(lesson) {
        const labels = lesson.items
          .map(function (item) {
            return "<strong>" + escapeHtml(item.text) + "</strong>";
          })
          .join("、");
        return "用今日其中一個或以上的詞語寫一句英文（可選：" + labels + "）。";
      }

      function historyPreview(lesson) {
        return lesson.items
          .map(function (item) {
            return item.text;
          })
          .join(" · ");
      }

      function computeStreak(completed) {
        const today = new Date();
        let streak = 0;
        let d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const todayKey = localDateKey(d);
        if (!completed[todayKey]) {
          d.setDate(d.getDate() - 1);
        }
        while (completed[localDateKey(d)]) {
          streak += 1;
          d.setDate(d.getDate() - 1);
        }
        return streak;
      }

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(function () {
          el.classList.remove("show");
        }, 2200);
      }

      function renderCard(targetId, dateKey, options) {
        const opts = options || {};
        const isToday = opts.isToday;
        const lesson = getLesson(dateKey);
        const data = store.load();
        const done = !!data.completed[dateKey];
        const sentence = data.sentences[dateKey] || "";

        const html =
          '<article class="card">' +
          '<span class="date-badge">' + formatDisplay(dateKey) + "</span>" +
          '<p class="section-label">今日三項 · 3 words / phrases</p>' +
          itemsHtml(lesson) +
          '<p class="section-label">例句 Example</p>' +
          '<p class="example">' + escapeHtml(lesson.example) + "</p>" +
          '<div class="task-box"><p class="section-label" style="margin-bottom:0.4rem">小任務 Task</p><p>' +
          taskText(lesson) +
          "</p></div>" +
          (isToday
            ? '<label class="section-label" for="sentenceBox" style="display:block;margin-top:1rem">我的句子 My sentence</label>' +
              '<textarea id="sentenceBox" placeholder="Type your sentence here…">' +
              escapeHtml(sentence) +
              "</textarea>"
            : sentence
              ? '<p class="section-label" style="margin-top:1rem">當日句子</p><p class="example" style="font-style:normal">' +
                escapeHtml(sentence) +
                "</p>"
              : "") +
          "</article>";

        document.getElementById(targetId).innerHTML = html;

        if (isToday) {
          const banner = document.getElementById("doneBanner");
          const btn = document.getElementById("doneBtn");
          if (done) banner.classList.add("show");
          else banner.classList.remove("show");
          if (btn) {
            btn.textContent = done ? "✓ 已完成（再按可取消）" : "完成今日打卡";
            btn.classList.toggle("done", done);
          }
          const box = document.getElementById("sentenceBox");
          if (box) {
            box.addEventListener("input", function () {
              const d = store.load();
              d.sentences[dateKey] = box.value;
              store.save(d);
            });
          }
        }
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderToday() {
        const key = localDateKey(new Date());
        const data = store.load();
        const done = !!data.completed[key];

        document.getElementById("todayCard").innerHTML =
          '<div id="innerToday"></div>' +
          '<div class="btn-row">' +
          '<button type="button" class="btn btn-primary' +
          (done ? " done" : "") +
          '" id="doneBtn">' +
          (done ? "✓ 已完成（再按可取消）" : "完成今日打卡") +
          "</button>" +
          "</div>";

        renderCard("innerToday", key, { isToday: true });

        document.getElementById("doneBtn").addEventListener("click", function () {
          const d = store.load();
          const k = localDateKey(new Date());
          d.completed[k] = !d.completed[k];
          if (!d.completed[k]) delete d.completed[k];
          const box = document.getElementById("sentenceBox");
          if (box && box.value.trim()) d.sentences[k] = box.value.trim();
          store.save(d);
          updateStreak();
          renderToday();
          if (d.completed[k]) toast("太棒了！🔥");
        });
      }

      function renderHistory() {
        const list = document.getElementById("historyList");
        const data = store.load();
        const items = [];
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        for (let i = 0; i < 45; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() - i);
          const key = localDateKey(d);
          const lesson = getLesson(key);
          items.push({ key: key, lesson: lesson, done: !!data.completed[key] });
        }
        list.innerHTML = items
          .map(function (item) {
            return (
              '<button type="button" class="history-item" data-key="' +
              item.key +
              '">' +
              '<div class="top"><span class="d">' +
              formatDisplay(item.key) +
              "</span>" +
              '<span class="' +
              (item.done ? "dot-done" : "dot-pending") +
              '" title="' +
              (item.done ? "已完成" : "未完成") +
              '"></span></div>' +
              '<div class="w">' +
              historyPreview(item.lesson) +
              "</div></button>"
            );
          })
          .join("");

        list.querySelectorAll(".history-item").forEach(function (btn) {
          btn.addEventListener("click", function () {
            openDay(btn.getAttribute("data-key"));
          });
        });
      }

      function openDay(key) {
        showPanel("day");
        renderCard("dayCard", key, { isToday: false });
      }

      function showPanel(name) {
        const panels = { today: "panelToday", history: "panelHistory", day: "panelDay" };
        Object.keys(panels).forEach(function (p) {
          const el = document.getElementById(panels[p]);
          const active = p === name;
          el.classList.toggle("active", active);
          el.hidden = !active;
        });
        document.querySelectorAll(".tabs button").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === (name === "day" ? "history" : name));
        });
      }

      function updateStreak() {
        document.getElementById("streakNum").textContent = String(computeStreak(store.load().completed));
      }

      document.querySelectorAll(".tabs button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          showPanel(btn.getAttribute("data-tab"));
          if (btn.getAttribute("data-tab") === "history") renderHistory();
        });
      });

      document.getElementById("backFromDay").addEventListener("click", function (e) {
        e.preventDefault();
        showPanel("history");
        renderHistory();
      });

      renderToday();
      updateStreak();
    })();
  </script>
</body>
</html>
