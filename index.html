  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #ecfdf5 100%);
      color: #1e293b;
      overflow-x: hidden;
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.12), 0 8px 10px -6px rgba(217, 119, 6, 0.08);
    }
    .pulse-ring {
      animation: pulseRing 2s infinite;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .float-slow {
      animation: floatSlow 3.2s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .hotspot-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hotspot-btn:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }
    .tab-active {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
    }
  </style>
