<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 40%),
        radial-gradient(circle at bottom right, #fde68a 0%, transparent 35%),
        var(--bg);
      padding: 1.5rem;
    }

    main {
      width: min(100%, 40rem);
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
    }

    a {
      display: block;
      padding: 1rem 1.1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.08);
      transform: translateY(-1px);
      outline: none;
    }

    .name {
      display: block;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.25rem;
    }

    .desc {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .path {
      display: inline-block;
      margin-top: 0.55rem;
      padding: 0.15rem 0.45rem;
      border-radius: 0.35rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Study Tools</h1>
    <p class="subtitle">Study tools for Charlotte and Matthew — pick an app to open.</p>
    <ul>
      <li>
        <a href="gs/">
          <span class="name">常識科溫習 · GS</span>
          <span class="desc">小三常識科互動溫習（單元一及單元二：第1至5課＋附頁）</span>
          <span class="path">/gs/</span>
        </a>
      </li>
      <li>
        <a href="dictation/">
          <span class="name">默書小幫手 · Dictation</span>
          <span class="desc">Dictation Helper for practice lists</span>
          <span class="path">/dictation/</span>
        </a>
      </li>
      <li>
        <a href="idioms/">
          <span class="name">成語填空大闖關 · Idioms</span>
          <span class="desc">100句情境測驗，按法寶分組練習</span>
          <span class="path">/idioms/</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
